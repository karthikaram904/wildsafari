<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | WildLife Safari</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link href="img/favicon.png" rel="icon">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <div class="register-wrapper">
    <div class="register-box">

        <a href="index.html" class="register-logo">
            <img src="img/wildsafari-logo.png" alt="Wildlife Safari">
        </a>

        <h2>Create Account</h2>
        <p class="register-subtitle">Join us and start your safari journey</p>

        <form>
            <div class="register-group">
                <i class="fa fa-user"></i>
                <input type="text" placeholder="Full Name" required>
            </div>

            <div class="register-group">
                <i class="fa fa-envelope"></i>
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="register-group">
                <i class="fa fa-lock"></i>
                <input type="password" placeholder="Password" required>
            </div>

            <div class="register-group">
                <i class="fa fa-lock"></i>
                <input type="password" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="register-btn">
                Register
            </button>

            <p class="register-footer-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </form>

    </div>
</div>


</body>
</html>
